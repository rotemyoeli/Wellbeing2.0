[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = ["cd /app && pip install -r requirements.txt"]

[start]
cmd = "cd /app && python -m flask db upgrade && python -m gunicorn 'app:create_app()' --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120"

[variables]
PYTHONUNBUFFERED = "1"
FLASK_APP = "app:create_app()"
