# Generic alembic configuration for Flask-Migrate.
# This file is read by `flask db ...` commands.

[alembic]
# Path to migration scripts (relative to the directory containing alembic.ini).
script_location = .

# Template used to generate migration files.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for created_at / file dates. UTC keeps all environments aligned.
timezone = UTC

# Maximum length of slugs (used in migration file names).
truncate_slug_length = 40

# sqlalchemy.url is set programmatically in env.py from the Flask app config.
# Do NOT put credentials here.

[post_write_hooks]
# Optional: run `black` on generated migration files. Disabled by default.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
